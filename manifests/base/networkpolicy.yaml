apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: container-debug
  labels:
    app: container-debug
    app.kubernetes.io/name: container-debug
    app.kubernetes.io/component: debugging-tool
spec:
  podSelector:
    matchLabels:
      app: container-debug
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - {}
