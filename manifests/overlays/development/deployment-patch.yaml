apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-debug
spec:
  template:
    spec:
      containers:
      - name: debug
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        envFrom:
        - configMapRef:
            name: debug-env-config