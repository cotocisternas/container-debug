name: Build and Publish Container

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint shell scripts with ShellCheck
        run: |
          shellcheck --version
          shellcheck scripts/*

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.4.3'

      - name: Validate Kustomize manifests
        run: |
          echo "Validating Kustomize manifests..."
          kustomize build manifests/base > /dev/null && echo "base: OK"
          kustomize build manifests/overlays/development > /dev/null && echo "development: OK"
          kustomize build manifests/overlays/staging > /dev/null && echo "staging: OK"
          kustomize build manifests/overlays/production > /dev/null && echo "production: OK"

      - name: Validate Kubernetes resources
        run: |
          echo "Validating rendered manifests against K8s schemas..."
          for overlay in base overlays/development overlays/staging overlays/production; do
            kustomize build "manifests/${overlay}" | kubectl apply --dry-run=client -f - 2>&1 | head -20
            echo "${overlay}: validated"
          done

  build-and-test:
    runs-on: ubuntu-latest
    needs: [lint, validate-manifests]
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image (multi-arch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build test image (native arch only)
        if: github.event_name == 'pull_request'
        run: docker build -t test-container .

      - name: Run Trivy vulnerability scanner
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'test-container'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Test container tools
        if: github.event_name == 'pull_request'
        run: |
          echo "=== Database Clients ==="
          docker run --rm test-container bash -c "
            psql --version &&
            mysql --version &&
            redis-cli --version &&
            mongosh --version
          "
          echo "=== Network Tools ==="
          docker run --rm test-container bash -c "
            ping -c 1 127.0.0.1 > /dev/null && echo 'ping: OK' &&
            nc -h 2>&1 | head -1 &&
            dig -v 2>&1 | head -1 &&
            nmap --version | head -1 &&
            traceroute --version 2>&1 | head -1
          "
          echo "=== Kubernetes & gRPC Tools ==="
          docker run --rm test-container bash -c "
            kubectl version --client &&
            grpcurl --version
          "
          echo "=== Development Tools ==="
          docker run --rm test-container bash -c "
            python3 --version &&
            git --version &&
            jq --version &&
            openssl version
          "
          echo "=== System Tools ==="
          docker run --rm test-container bash -c "
            htop --version 2>&1 | head -1 &&
            curl --version | head -1 &&
            wget --version | head -1
          "

      - name: Test custom scripts
        if: github.event_name == 'pull_request'
        run: |
          echo "=== Script Help Output ==="
          docker run --rm test-container test-network --help
          docker run --rm test-container test-db-connection --help
          docker run --rm test-container test-rabbitmq --help

          echo "=== Script Functionality ==="
          docker run --rm test-container test-network --quick 127.0.0.1
          docker run --rm test-container debug-demo

      - name: Test container security context
        if: github.event_name == 'pull_request'
        run: |
          echo "=== Verify non-root user ==="
          docker run --rm test-container id
          docker run --rm test-container bash -c "whoami && groups"

          echo "=== Verify no sudo access ==="
          docker run --rm test-container bash -c "sudo echo test 2>&1 || echo 'sudo not available: OK'"
